name: Test
on:
  workflow_call:
permissions: {}
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    # Only the x86_64 runners have KVM, the aarch64 guest runs on TCG
    name: x86_64-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      QEMU_BIN_TEST_TARBALL: ${{ github.workspace }}/dist/qemu-x86_64-linux-gnu.tar.gz
      QEMU_BIN_TEST_REQUIRE_KVM: '1'
      QEMU_BIN_TEST_REQUIRE_FUSE: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup aqua
      uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.65.2
    - name: Restore aqua tools cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: aqua-${{ hashFiles('.aqua/pkgs/zig.yaml', '.aqua/pkgs/ninja.yaml', '.aqua/pkgs/uv.yaml') }}
        path: ~/.local/share/aquaproj-aqua/
    - name: Enable KVM
      shell: bash -euo pipefail {0}
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    # The FUSE export is mounted by the runner user with fusermount3
    - name: Install fuse3
      shell: bash -euo pipefail {0}
      run: |-
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends fuse3
    - name: Download artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist/
        name: artifact-qemu-x86_64-linux-gnu
    - name: Verify sha256sum
      shell: bash -euo pipefail {0}
      run: |-
        cd dist
        sha256sum -c qemu-x86_64-linux-gnu.tar.gz.sha256sum
    - name: Test on the host
      shell: bash -euo pipefail {0}
      run: |-
        task test:host
    - name: Test with the minimum glibc
      shell: bash -euo pipefail {0}
      run: |-
        task test:container
