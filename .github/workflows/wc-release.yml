name: Release
on:
  workflow_call:
    inputs:
      build-version:
        default: ""
        required: false
        type: string
      release-tag:
        default: ""
        required: false
        type: string
      release:
        default: false
        required: false
        type: boolean
      fingerprint:
        default: ""
        required: false
        type: string
      components:
        default: "{}"
        required: false
        type: string
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  release:
    name: ${{ inputs.release-tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      BUILD_VERSION: ${{ inputs.build-version }}
      RELEASE_TAG: ${{ inputs.release-tag }}
      FINGERPRINT: ${{ inputs.fingerprint }}
      COMPONENTS: ${{ inputs.components }}
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist/
        name: release-artifacts
    - name: Check artifacts
      shell: bash -euo pipefail {0}
      run: tree --charset ASCII dist/
    - name: Verify sha256sums
      shell: bash -euo pipefail {0}
      run: |-
        echo 'Verify sha256sums'
        cd dist
        sha256sum -c SHA256SUMS
    - name: Verify artifact attestation
      if: ${{ !startsWith(github.event_name, 'pull') }}
      shell: bash -euo pipefail {0}
      run: |-
        echo 'Verify artifact attestation'
        cd dist
        set -x
        for f in $(find . -type f -not -name '*.sigstore.json' -printf '%f\n' | sort); do
          gh attestation verify "$f" -R "${GITHUB_REPOSITORY}"
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup cosign
      if: ${{ !startsWith(github.event_name, 'pull') }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Verify code signing with cosign
      if: ${{ !startsWith(github.event_name, 'pull') }}
      env:
        CERTIFICATE_IDENTITY: >-
          ${{ github.server_url }}/${{ github.repository }}/.github/workflows/wc-sign.yml@${{ github.ref }}
        CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
      shell: bash -euo pipefail {0}
      run: |-
        echo 'Verify code signing with cosign'
        cd dist
        set -x
        for f in $(find . -type f -not -name '*.sigstore.json' -printf '%f\n' | sort); do
          declare -a args
          args=("verify-blob" "$f")
          args+=("--bundle" "$f.sigstore.json")
          args+=("--certificate-identity" "$CERTIFICATE_IDENTITY")
          args+=("--certificate-oidc-issuer" "$CERTIFICATE_OIDC_ISSUER")
          cosign "${args[@]}"
        done
    - name: Prepare release notes
      env:
        CERTIFICATE_IDENTITY: >-
          ${{ github.server_url }}/${{ github.repository }}/.github/workflows/wc-sign.yml@${{ github.ref }}
        CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
      shell: bash -euo pipefail {0}
      run: |-
        echo 'Prepare release notes'
        BUILD_DATE="$(date +"%Y/%m/%d %I:%M:%S")"
        SHA256SUMS="$(cat dist/SHA256SUMS)"
        VERSIONS="$(echo "${COMPONENTS}" | jq -r 'to_entries[] | "| \(.key) | `\(.value)` |"')"
        cat <<-__EOF__ | tee /tmp/release-note.txt
        The binaries were built automatically on GitHub Actions.
        When the build system changes, the binaries may change too.
        Please verify using SHA256SUMS or verify the signature using cosign.

        QEMU version: \`${BUILD_VERSION}\`
        Build date: \`${BUILD_DATE}\`

        | Component | Version |
        | --- | --- |
        ${VERSIONS}

        SHA256SUMS:
        \`\`\`checksum
        ${SHA256SUMS}
        \`\`\`

        GitHub Artifact Attestations:
        \`\`\`console
        $ gh attestation verify "[artifact path]"
        \`\`\`

        Cosign Verifying Signatures:
        \`\`\`console
        $ cosign verify-blob "[artifact path]" \\
            --bundle "[artifact path].sigstore.json" \\
            --certificate-identity \\
            "$CERTIFICATE_IDENTITY" \\
            --certificate-oidc-issuer \\
            "$CERTIFICATE_OIDC_ISSUER"
        \`\`\`

        See also: https://wiki.qemu.org/ChangeLog/${BUILD_VERSION%.*}

        Build inputs: \`${FINGERPRINT}\`
        __EOF__
    - name: Release artifacts
      if: ${{ inputs.release && !startsWith(github.event_name, 'pull') && github.ref == 'refs/heads/main' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash -euo pipefail {0}
      run: |-
        if gh release view "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          echo "release ${RELEASE_TAG} exists"
        else
          gh release create "${RELEASE_TAG}" dist/* \
            --target "${GITHUB_SHA}" \
            -t "${RELEASE_TAG}" \
            -F /tmp/release-note.txt \
            -R "${GITHUB_REPOSITORY}"
        fi
