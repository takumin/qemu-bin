name: CI
on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  # 09:30 JST, releases changes merged after the release of the day
  - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      build-version:
        description: "Build version"
        default: ""
        required: false
        type: string
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  ##############################################################################
  # Format
  ##############################################################################
  format:
    name: Format
    permissions:
      contents: read
    uses: $/.github/workflows/wc-format.yml
  ##############################################################################
  # Lint
  ##############################################################################
  lint:
    name: Lint
    permissions:
      contents: read
    uses: $/.github/workflows/wc-lint.yml
  ##############################################################################
  # Setup
  ##############################################################################
  setup:
    name: Setup
    permissions:
      contents: read
    uses: $/.github/workflows/wc-setup.yml
    with:
      build-version: ${{ github.event.inputs.build-version }}
  ##############################################################################
  # Build
  ##############################################################################
  build:
    needs:
    - setup
    name: Build
    if: github.event_name != 'schedule' || needs.setup.outputs.release == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/wc-build.yml
    with:
      build-version: ${{ needs.setup.outputs.build-version }}
  ##############################################################################
  # Test
  ##############################################################################
  test:
    needs:
    - build
    name: Test
    permissions:
      contents: read
    uses: $/.github/workflows/wc-test.yml
  ##############################################################################
  # Sign
  ##############################################################################
  sign:
    needs:
    - setup
    - build
    - test
    name: Sign
    permissions:
      id-token: write
      attestations: write
    uses: $/.github/workflows/wc-sign.yml
  ##############################################################################
  # Release
  ##############################################################################
  release:
    needs:
    - setup
    - build
    - sign
    name: Release
    permissions:
      contents: write
    uses: $/.github/workflows/wc-release.yml
    with:
      build-version: ${{ needs.setup.outputs.build-version }}
      release-tag: ${{ needs.setup.outputs.release-tag }}
      release: ${{ needs.setup.outputs.release == 'true' }}
      fingerprint: ${{ needs.setup.outputs.fingerprint }}
      components: ${{ needs.setup.outputs.components }}
  ##############################################################################
  # Status Check
  ##############################################################################
  ci:
    needs:
    - format
    - lint
    - setup
    - build
    - test
    - sign
    - release
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ failure() || cancelled() }}
    steps:
    - name: Failure Status
      run: exit 1
